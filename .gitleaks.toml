# gitleaks configuration for clipy-si-core
#
# This repository is a secret-DETECTION engine: its KAT vectors (kat/*.json) and
# detector tests (crates/clipy-si-core/tests/*.rs) intentionally contain
# format-valid, SYNTHETIC credentials. Every value allowlisted below is either a
# vendor-published documentation sample or an obviously fabricated placeholder —
# never a real secret. Allowlisting is by VALUE (exact match), not by directory,
# so a real secret accidentally committed next to the fixtures would still be
# reported. See development-docs 40-product-ops/50-core-open-source-plan.md P1-3.

[extend]
useDefault = true

# --- Vendor-published documentation samples (public by construction) ---
[[allowlists]]
description = "AWS documentation sample credentials (docs.aws.amazon.com)"
regexTarget = "match"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG1bPxRfi''',
]

[[allowlists]]
description = "Stripe documentation test key (docs.stripe.com, widely mirrored)"
regexTarget = "match"
regexes = ['''[sr]k_live_4eC39HqLyjWDarjtT1zdp7dc''']

[[allowlists]]
description = "jwt.io default example token (HS256, sub=1234567890)"
regexTarget = "match"
regexes = ['''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.''']

[[allowlists]]
description = "Google API key sample widely used in public test suites (gitleaks/detect-secrets fixtures)"
regexTarget = "match"
regexes = ['''AIzaSyDaGmWKa4JsXZ-HjGw7ISLn_3namBGewQe''']

# --- Fabricated placeholders (structurally obvious: zeros, alphabet runs, leetspeak) ---
[[allowlists]]
description = "Synthetic tokens built from zero-runs / alphabet runs used across KAT and detector tests"
regexTarget = "match"
regexes = [
  '''ghp_0{38}AB''',
  '''xoxb-2{10}-3{10}-aBcDeFgHiJkLmNoPqRsTuVwX''',
  '''xapp-1-A012345678-0123456789-abcdef0123456789''',
  '''SG\.0123456789abcdefABCDEF\.0123456789012345678901234567890123456789abc''',
  '''glpat-ABCDEFGHIJ1234567890''',
  '''hooks\.slack\.com/services/T0{8}/B0{8}/X{24}''',
  '''secret_key=ABCD1234EFGH5678''',
  '''access_token=abc123def456ghi789''',
  '''password=hunter2zzzz''',
  '''Bearer a1b2c3d4e5f6g7h8''',
  '''admin:S3cr3tPass@''',
  '''dbuser:Pa55w0rd!@''',
]

[[allowlists]]
description = "KAT vector hex fields: deterministic PBKDF2/AES outputs and synthetic inputs (kat/kdf.json, kat/crypto.json). Shape-scoped to the JSON field, not the directory."
regexTarget = "match"
regexes = ['''(?:passphrase|key|salt|nonce|plaintext|expected(?:_combined)?|mac)_hex":\s*"[0-9a-f]+"''']
