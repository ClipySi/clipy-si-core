name: Core CI

# PR / push gate. The toolchain is pinned by rust-toolchain.toml (rustup on the
# runners honors it, installing the declared components and targets on demand),
# so no third-party toolchain action is needed. All third-party actions are
# pinned to full commit SHAs (plan §P2-3).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly advisories sweep: new RustSec advisories appear without any push.
    - cron: "17 21 * * 1"

permissions:
  contents: read

jobs:
  rust:
    name: Rust fmt, clippy, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  supply-chain:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  swift-kat:
    name: XCFramework and Swift KAT
    runs-on: macos-15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build XCFramework
        run: ./build-xcframework.sh
      - name: Swift KAT tests
        working-directory: bindings/swift/ClipySiCore
        run: swift test
      - name: Generated bindings are current
        run: git diff --exit-code
