# cargo-deny configuration for clipy-si-core (plan §P2-1, checklist #4).
# advisories: RustSec DB (this replaces a separate cargo-audit run).
# licenses: allowlist matches the measured dependency set — notably uniffi (MPL-2.0,
# linked unmodified; see the app's THIRD_PARTY_LICENSES.md) and foldhash (Zlib).

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "Unlicense",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
